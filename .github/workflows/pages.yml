name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-generate files.json from all .xlsx in root
        run: |
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync(".").filter(f => /\.xlsx$/i.test(f) && !f.startsWith("~$"));
            fs.writeFileSync("files.json", JSON.stringify(files, null, 2));
            console.log("Generated files.json:", files);
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

